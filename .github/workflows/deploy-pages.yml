name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /tc-vrm-viewer/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # Always ship the latest mistlib engine without
      # changing package files. The version is read from the installed
      # package.json rather than `npm ls`, which exits non-zero once latest no
      # longer matches the pin in package.json. The type-check in the build step
      # gates deployment: API breaks fail the build and the previous Pages
      # deploy stays live.
      - name: Install latest mistlib
        run: |
          npm install --no-save @tik-choco/mistlib@latest
          node -p "'@tik-choco/mistlib ' + JSON.parse(require('fs').readFileSync('node_modules/@tik-choco/mistlib/package.json', 'utf8')).version"

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
